# Source registry for the weekly AutoChina pipeline.
# Principle: never scrape brand/government home pages. Only pull from
# machine-oriented outlets: exchange disclosures, RSS, Google News RSS.

window_days: 8            # look-back window for headlines
max_headlines_per_source: 12

# --- Official disclosures (HKEX "Disclosure of Interests" title search) ---
# Every listed OEM must file monthly volume announcements as static PDFs.
hkex:
  - code: "1211"
    name: "BYD"
    title_regex: "PRODUCTION AND SALES VOLUME"
    parser: "byd_table"
  - code: "0175"
    name: "Geely Auto"
    title_regex: "SALES VOLUME"
    parser: "generic"
  - code: "2015"
    name: "Li Auto"
    title_regex: "DELIVER"
    parser: "generic"
  - code: "9868"
    name: "XPeng"
    title_regex: "DELIVER"
    parser: "generic"
  - code: "9866"
    name: "NIO"
    title_regex: "DELIVER"
    parser: "generic"
  - code: "9863"
    name: "Zeekr"
    title_regex: "DELIVER|SALES"
    parser: "generic"

# --- Google News RSS keyword monitors (replaces JS-rendered gov/association sites) ---
google_news:
  - id: gnews_cpca
    query: "乘联会 零售 新能源"
    lang: zh
    note: "CPCA monthly retail/wholesale; syndicated copies carry identical numbers"
  - id: gnews_caam
    query: "中汽协 汽车 销量"
    lang: zh
  - id: gnews_miit
    query: "工信部 新能源汽车 政策"
    lang: zh
  - id: gnews_xiaomi
    query: "小米汽车 交付"
    lang: zh
  - id: gnews_tariff
    query: "China EV tariff OR countervailing OR anti-subsidy"
    lang: en
  - id: gnews_export
    query: "Chinese automakers export Europe OR Mexico OR Brazil"
    lang: en

# --- Plain RSS ---
rss:
  - id: cnevpost
    url: "https://cnevpost.com/feed/"
  - id: carnewschina
    url: "https://carnewschina.com/feed/"
  - id: electrek
    url: "https://electrek.co/feed/"
    include_regex: "(?i)china|byd|nio|xpeng|xiaomi|geely|zeekr|li auto|catl|chery|leapmotor"
  - id: globenewswire_public
    url: "https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies"
    include_regex: "(?i)\\b(nio|xpeng|li auto|zeekr|polestar|lotus tech)\\b"
  - id: prnewswire
    url: "https://www.prnewswire.com/rss/news-releases-list.rss"
    include_regex: "(?i)\\b(nio|xpeng|li auto|byd|geely|zeekr|xiaomi)\\b"
